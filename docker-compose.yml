services:
  discordttcbot:
    image: ghcr.io/xenycx/discordttcbot:latest
    container_name: discordttcbot
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - API_KEY=${API_KEY:-}            # optional, the key is discovered automatically
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    volumes:
      - tilecache:/app/cache
    restart: always

volumes:
  tilecache:
